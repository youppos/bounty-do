name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: gamified_todo
        run: flutter pub get

      - name: Build iOS Application
        working-directory: gamified_todo
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 | tee build_output.log
        continue-on-error: false

      - name: Package IPA
        working-directory: gamified_todo
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -q app-release.ipa Payload
          echo "IPA packaging complete"

      - name: Report Failure Summary
        if: failure()
        run: |
          if [ -f gamified_todo/build_output.log ]; then
            echo "### ❌ Build iOS Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 gamified_todo/build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Push failure log to ci-logs branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git reset --hard
          if [ -f gamified_todo/build_output.log ]; then
            cp gamified_todo/build_output.log full_build_output.log
            grep -E -B 20 -A 5 "FAILURE|Exception|Error:" gamified_todo/build_output.log > latest_error.log || true
            git add -f full_build_output.log latest_error.log
            git commit -m "chore: record iOS build error for run ${{ github.run_number }}"
            git push origin ci-logs --force || true
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: gamified_todo/build/ios/iphoneos/app-release.ipa
          if-no-files-found: error
