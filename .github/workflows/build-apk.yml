name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'gamified_todo/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: gamified_todo
        run: flutter pub get

      - name: Build APK
        working-directory: gamified_todo
        run: |
          set -o pipefail
          flutter build apk --release -v --android-skip-build-dependency-validation 2>&1 | tee build_output.log
        continue-on-error: false

      - name: Report Failure Summary
        if: failure()
        run: |
          if [ -f gamified_todo/build_output.log ]; then
            echo "### ❌ Build APK Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 gamified_todo/build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: gamified_todo/build_output.log

      - name: Push failure log to ci-logs branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git reset --hard
          if [ -f gamified_todo/build_output.log ]; then
            tail -n 200 gamified_todo/build_output.log > latest_error.log
            git add -f latest_error.log
            git commit -m "chore: record build error for run ${{ github.run_number }}"
            git push origin ci-logs --force || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            gamified_todo/build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            **/app-release.apk
          if-no-files-found: error
